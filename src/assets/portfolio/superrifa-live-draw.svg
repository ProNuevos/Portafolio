  <text x="174" y="456" fill="#C7D2FE" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Sorteo ejecutandose</text>
  <rect x="174" y="478" width="252" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
