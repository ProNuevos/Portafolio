      <stop offset="0.66" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <radialGradient id="ldorb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 210) rotate(39) scale(260 260)">
