<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Retrato frontal profesional</title>
  <desc id="desc">Ilustracion vectorial frontal estilo corporativo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1d2d"/>
      <stop offset="100%" stop-color="#17283d"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7bb7ff" stop-opacity="0.22"/>
