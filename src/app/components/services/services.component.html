<section id="servicios" class="section">
  <div class="container">
    <div class="text-center mb-5" appReveal data-appear>
      <h2 class="fw-bold">Servicios</h2>
      <p class="text-secondary">Soluciones de punta a punta, listas para producción.</p>
    </div>
    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let service of services" appReveal data-appear>
        <article class="orb-card service-card rounded-4 p-4 h-100">
          <div class="feature service-feature d-flex align-items-start gap-3">
            <i class="bi {{ service.icon }}"></i>
            <div>
              <h3>{{ service.title }}</h3>
              <p>{{ service.description }}</p>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
