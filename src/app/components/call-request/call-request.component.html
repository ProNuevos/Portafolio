<dialog #dialog class="estimate-dialog call-dialog" aria-labelledby="call-title">
  <div class="estimate-heading"><button type="button" class="estimate-close" (click)="close()" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button><div class="estimate-kicker"><span class="estimate-icon"><i class="bi bi-calendar2-check"></i></span> COORDINEMOS TU IDEA</div><h2 id="call-title">Solicitá una <span>llamada.</span></h2><p>Completá estos datos y te escribo por WhatsApp para coordinar.</p></div>
  <div class="estimate-body"><form [formGroup]="form" (ngSubmit)="submit()" class="row g-3 estimate-form">
    <div class="col-md-6"><label class="form-label" for="call-nombre">Nombre</label><input id="call-nombre" class="form-control" [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched" formControlName="nombre"><div class="invalid-feedback" *ngIf="form.get('nombre')?.hasError('required') && form.get('nombre')?.touched">El nombre es obligatorio.</div><div class="invalid-feedback" *ngIf="form.get('nombre')?.hasError('maxlength')">Máximo 100 caracteres.</div></div>
    <div class="col-md-6"><label class="form-label" for="call-negocio">Negocio o empresa <span class="text-secondary">(opcional)</span></label><input id="call-negocio" class="form-control" [class.is-invalid]="form.get('negocio')?.invalid && form.get('negocio')?.touched" formControlName="negocio"><div class="invalid-feedback" *ngIf="form.get('negocio')?.hasError('maxlength')">Máximo 120 caracteres.</div></div>
    <div class="col-12"><label class="form-label" for="call-proyecto">¿Qué te gustaría crear?</label><select id="call-proyecto" class="form-select" [class.is-invalid]="form.get('proyecto')?.invalid && form.get('proyecto')?.touched" formControlName="proyecto"><option value="">Seleccioná una opción</option><option>Landing o sitio institucional</option><option>Sistema web o panel administrativo</option><option>Reservas y turnos</option><option>Automatización o agente de IA</option><option>Otro proyecto</option></select><div class="invalid-feedback" *ngIf="form.get('proyecto')?.hasError('required') && form.get('proyecto')?.touched">Seleccioná qué te gustaría crear.</div></div>
    <div class="col-md-6"><label class="form-label" for="call-dia">Día preferido <span class="text-secondary">(opcional)</span></label><input id="call-dia" class="form-control" [class.is-invalid]="form.get('dia')?.invalid && form.get('dia')?.touched" placeholder="Ej.: martes 15" formControlName="dia"><div class="invalid-feedback" *ngIf="form.get('dia')?.hasError('maxlength')">Máximo 80 caracteres.</div></div>
    <div class="col-md-6"><label class="form-label" for="call-whatsapp">WhatsApp</label><input id="call-whatsapp" class="form-control" [class.is-invalid]="form.get('whatsapp')?.invalid && form.get('whatsapp')?.touched" type="tel" placeholder="Ej.: +598 96 909 509" formControlName="whatsapp"><div class="invalid-feedback" *ngIf="form.get('whatsapp')?.hasError('required') && form.get('whatsapp')?.touched">El WhatsApp es obligatorio.</div><div class="invalid-feedback" *ngIf="form.get('whatsapp')?.hasError('maxlength')">Máximo 30 caracteres.</div></div>
    <div class="col-12 d-grid"><button class="btn btn-orb" type="submit"><i class="bi bi-whatsapp me-2"></i>Solicitar llamada por WhatsApp</button></div><div class="col-12 small estimate-status" *ngIf="status">{{ status }}</div>
  </form></div>
</dialog>
