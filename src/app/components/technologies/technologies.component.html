<section id="tecnologias" class="section pt-0">
  <div class="container">
    <div class="row g-4 align-items-center">
      <div class="col-lg-6" #appearElement data-appear>
        <h2 class="fw-bold mb-3">Stack & herramientas</h2>
        <p class="text-secondary">Elegimos la herramienta adecuada para cada problema. Priorizamos mantenibilidad y costos razonables.</p>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <span *ngFor="let tool of stackTools" class="badge rounded-pill stack-badge">{{ tool }}</span>
        </div>
      </div>
      <div class="col-lg-6" #appearElement data-appear>
        <div class="orb-card rounded-4 p-4">
          <h5 class="mb-3">Checklist de calidad</h5>
          <ul class="text-secondary mb-0">
            <li *ngFor="let item of qualityChecklist">{{ item }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
