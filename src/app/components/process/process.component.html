<section id="proceso" class="section">
  <div class="container">
    <div class="text-center mb-5" appReveal data-appear>
      <h2 class="fw-bold">Cómo trabajamos</h2>
      <p class="text-secondary">Metodología simple, transparente y efectiva.</p>
    </div>
    <div class="row g-4">
      <div class="col-md-6 col-lg-3" *ngFor="let step of steps" appReveal data-appear>
        <article class="process-step h-100">
          <div class="process-step-image" [style.background-image]="'url(' + step.image + ')'" role="img" [attr.aria-label]="step.title"></div>
          <div class="process-step-content">
            <span class="process-step-number">0{{ step.number }}</span>
            <h3>{{ step.title }}</h3>
            <p>{{ step.description }}</p>
          </div>
        </article>
        </div>
      </div>
    </div>
</section>
